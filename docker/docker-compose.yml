version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DIFFUCAT_AUTH_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DIFFUCAT_LAB_MOCK_MODE=true
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
    restart: unless-stopped

